[Metadata]

# Basic mod info
Name = Solaufein Romance (Modern EE/EET Edition)
Version = 2.1.11
Author = Weimer (Original), Modernization by /u/celestialfury
Description = A fully modernized, modular, EE/EET-compatible version of the classic Solaufein Romance mod, featuring per-dialogue TRA scoping, layered language fallback, localized component names, v1.0-guarded CRE field writes, full 12-slot bark restoration with working bark playback, load-order-safe 2DA patches, and a content-aligned 5-component layout grouped by when each component's content actually fires.
Readme = readme-ee_updates.md
Homepage = https://github.com/CelestialFury-BG/SolaufeinEE
Forum = 
Download = https://github.com/CelestialFury-BG/SolaufeinEE/releases/tag/v2.1.11

# This directive is required for Project Infinity to treat the component
# indices as globally unique labels.
LabelType = GloballyUnique

# Component definitions
# Format: <index> = <name> | <category>
# Indexes MUST match the DESIGNATED numbers in your setup-solaufeinEE.tp2 exactly!
#
# Component grouping rationale: components are ordered by when their
# content fires in the campaign. Component 10 (Core) installs the NPC
# and its SoA-side content. Component 20 is the SoA Chapter 6 vampire
# story branch. Component 30 is the ToB continuation. Component 40 is
# the ToB Eclipse challenge. Component 50 is a set of independent
# vanilla patches that do not require Component 10 at all.

10 = Solaufein: Core NPC + SoA Content | NPC
20 = Solaufein: Vampiric Solaufein + Cleanse | Quest
30 = Solaufein: ToB Continuation | NPC
40 = Solaufein: Eclipse Sequence | Quest
50 = Solaufein: Extras (KVFix, Multig, UHMER, Misc) | Tweaks
